[package]
name = "ubiq-reboot"
version = "0.1.0"
edition = "2024"
description = "Cross-platform health and network tooling for the Ubiq blockchain"
license = "MIT"
repository = "https://github.com/IsaacNewtonne/Ubiq-Reboot"

[[bin]]
name = "ubiq-health"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
